# Spring Boot test profile properties
# Testcontainers @ServiceConnection dynamically provides ephemeral PostgreSQL coordinates
spring.datasource.url=jdbc:postgresql://localhost:5432/apexmatch_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL configuration for integration tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.testcontainers=INFO
logging.level.com.apexmatch=INFO
